##### GENERAL #####

# Use true color (needed for Neovim + modern themes)
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

# Faster escape for Neovim
set -sg escape-time 10

# Enable mouse support
set -g mouse on

# Start window & pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Don't rename windows automatically
set -g allow-rename off

# History
set -g history-limit 50000


##### PREFIX #####

# Change prefix to Ctrl-a (classic + comfy)
unbind C-b
set -g prefix C-a
bind C-a send-prefix


##### SPLITS #####

# Vim-like splits
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# resize panes with vim keys
bind -r -n m-h resize-pane -l 5
bind -r -n m-j resize-pane -d 5
bind -r -n m-k resize-pane -u 5
bind -r -n m-l resize-pane -r 5


##### pane navigation #####

# vim-style pane switching
bind -n m-h select-pane -l
bind -n m-j select-pane -d
bind -n m-k select-pane -u
bind -n m-l select-pane -r


##### copy mode (vi style) #####

setw -g mode-keys vi
bind -t copy-mode-vi v send -x begin-selection
bind -t copy-mode-vi y send -x copy-selection
bind -t copy-mode-vi escape send -x cancel


##### transparency & look #####

# transparent background
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour51"

# no ugly pane background
set -g window-style bg=default
set -g window-active-style bg=default

# status bar
set -g status on
set -g status-position bottom
set -g status-interval 5

# transparent status bar
set -g status-style "bg=default,fg=colour248"

# left side
set -g status-left-length 40
set -g status-left "#[fg=colour51]  #[fg=colour248]#s "

# right side
set -g status-right-length 100
set -g status-right "#[fg=colour248]%y-%m-%d  #[fg=colour51]%h:%m "

# windows
setw -g window-status-style "fg=colour245,bg=default"
setw -g window-status-current-style "fg=colour51,bg=default,bold"

setw -g window-status-format " #i:#w "
setw -g window-status-current-format " #[fg=colour51]#i:#w "


##### quality of life #####

# reload config
bind r source-file ~/.tmux.conf \; display "tmux reloaded ✓"

# keep panes when exiting
set -g detach-on-destroy off

# better scrollback in terminals
set -g focus-events on
