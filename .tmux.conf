##### PREFIX #####
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

##### RELOAD #####
bind r source-file ~/.tmux.conf \; display "Reloaded!"

##### PANES #####
unbind '"'
unbind %
bind | split-window -h
bind - split-window -v

##### MOUSE #####
set -g mouse on

##### VI MODE #####
setw -g mode-keys vi

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

##### TRUE COLOR #####
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

##### ESCAPE SPEED #####
set -sg escape-time 10

##### STATUS BAR (Rose Pine-ish transparent look) #####
set -g status-position bottom
set -g status-interval 2
set -g status-style "bg=default,fg=#e0def4"

set -g status-left "#[fg=#9ccfd8] #S "
set -g status-right "#[fg=#c4a7e7] %Y-%m-%d %H:%M "

setw -g window-status-current-style "fg=#9ccfd8,bold"
setw -g window-status-style "fg=#6e6a86"

##### PANE BORDERS #####
set -g pane-border-style "fg=#403d52"
set -g pane-active-border-style "fg=#9ccfd8"

##### CLIPBOARD SYNC #####
set -g set-clipboard on

##### VIM-TMUX NAVIGATOR INTEGRATION #####
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +g?\.?n?vim?u?'"

bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
